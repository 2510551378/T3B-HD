name: Source checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  source-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Syntax and asset-free source core
        run: python scripts/check_source.py
